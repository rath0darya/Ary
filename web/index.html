<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARY Episode Watcher</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--text:#f4f6fb;--muted:#9ba3b5;--line:#262b38;--accent:#e31b23;--accent2:#ff4d55;--good:#45d483;--warn:#f4bd54}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#291015 0,#08090d 42%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit}.wrap{max-width:1180px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:10px 0 30px}
.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#751018);display:grid;place-items:center;font-weight:900;box-shadow:0 12px 30px #0008}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}button:hover{border-color:#4b5365}button.primary{background:var(--accent);border-color:var(--accent);font-weight:800}button:disabled{opacity:.55;cursor:wait}
.hero{border:1px solid var(--line);background:linear-gradient(145deg,#151820,#0e1016);border-radius:20px;padding:22px;margin-bottom:18px}
.hero h2{margin:0 0 7px;font-size:22px}.hero p{margin:0;color:var(--muted);line-height:1.6}
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0}.search{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--text);padding:12px 14px;outline:none}.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:linear-gradient(160deg,#13161e,#0e1016);border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}
.cardtop{display:flex;justify-content:space-between;gap:10px}.ep{font-size:19px;font-weight:850}.id{font-size:10px;color:#687184;margin-top:5px;word-break:break-all}
.badge{font-size:11px;padding:5px 8px;border:1px solid #343a48;border-radius:999px;color:#cbd1de;height:max-content}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0;color:var(--muted);font-size:12px}.meta span{background:#0a0c11;border:1px solid #242936;padding:5px 8px;border-radius:7px}
.download{width:100%;margin-top:5px;background:var(--accent);border-color:var(--accent);font-weight:800}
.inspect{width:100%;margin-top:8px}
.job{margin-top:10px;border:1px solid #293041;background:#0b0d12;border-radius:11px;padding:10px;font-size:12px;display:none}.job.show{display:block}.bar{height:6px;background:#202532;border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;width:0;background:var(--good);transition:width .3s}
.empty,.loading{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:5}.modal.open{display:grid}.dialog{max-width:760px;width:100%;max-height:88vh;overflow:auto;background:#11141c;border:1px solid var(--line);border-radius:18px;padding:20px}.dialoghead{display:flex;justify-content:space-between;gap:15px;align-items:center}.dialog h3{margin:0}.close{border-radius:50%;width:38px;height:38px;padding:0}.variant{border:1px solid var(--line);background:#0b0d12;border-radius:11px;padding:12px;margin-top:9px}.variant.best{border-color:var(--accent)}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.small{font-size:12px;word-break:break-all}
.toast{position:fixed;right:18px;bottom:18px;background:#171a23;border:1px solid var(--line);padding:12px 15px;border-radius:11px;display:none;z-index:8;max-width:360px}.toast.show{display:block}
@media(max-width:650px){.wrap{padding:15px}header{align-items:flex-start;flex-direction:column}.hero{padding:17px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">ARY</div><div><h1>ARY Watcher</h1><div class="sub">All series · all episodes · HLS inspection</div></div></div><div class="actions"><button onclick="loadSeries(true)">Refresh</button><button onclick="health()">System</button></div></header>
<section class="hero"><h2>ARY Plus Catalogue</h2><p>Browse discovered series, open their complete episode lists, inspect available HLS variants, and download the highest advertised quality.</p></section>
<div class="toolbar"><input id="search" class="search" placeholder="Search series..." oninput="renderSeries()"><div id="count" class="count">Loading…</div></div>
<div id="grid" class="grid"><div class="loading">Discovering series…</div></div>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialoghead"><div><h3 id="modalTitle"></h3><div id="modalSub" class="sub"></div></div><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
let series=[],currentSeries=null,episodes=[],jobs=new Map();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function bytes(n){if(!n)return"0 B";const u=["B","KB","MB","GB"],i=Math.min(3,Math.floor(Math.log(n)/Math.log(1024)));return(n/Math.pow(1024,i)).toFixed(i?1:0)+" "+u[i];}
function toast(x){const e=document.getElementById("toast");e.textContent=x;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),3200)}
async function get(u){const r=await fetch(u);let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw Error(d.error||("HTTP "+r.status));return d}
async function loadSeries(refresh=false){document.getElementById("grid").innerHTML='<div class="loading">Discovering series…</div>';try{series=(await get("/api/series"+(refresh?"?refresh=1":""))).series||[];renderSeries()}catch(e){document.getElementById("grid").innerHTML='<div class="empty">'+esc(e.message)+"</div>"}}
function renderSeries(){const q=document.getElementById("search").value.toLowerCase().trim();const list=series.filter(x=>(x.title+" "+x.id).toLowerCase().includes(q));document.getElementById("count").textContent=list.length+" series";document.getElementById("grid").innerHTML=list.length?list.map(x=>'<article class="card"><div class="cardtop"><div><div class="ep">'+esc(x.title)+'</div><div class="id">'+esc(x.id)+'</div></div><span class="badge">Series</span></div><button class="download" onclick="openSeries('+JSON.stringify(x.id)+','+JSON.stringify(x.title)+')">View Episodes</button></article>').join(""):'<div class="empty">No matching series.</div>'}
async function openSeries(id,title){currentSeries={id,title};document.getElementById("modalTitle").textContent=title;document.getElementById("modalSub").textContent="Loading episodes…";document.getElementById("modalBody").innerHTML='<div class="loading">Loading complete episode catalogue…</div>';document.getElementById("modal").classList.add("open");try{episodes=(await get("/api/episodes?series="+encodeURIComponent(id))).episodes||[];renderEpisodes()}catch(e){document.getElementById("modalBody").innerHTML='<div class="empty">'+esc(e.message)+"</div>"}}
function renderEpisodes(){document.getElementById("modalSub").textContent=episodes.length+" episodes";document.getElementById("modalBody").innerHTML=episodes.map(e=>'<div class="variant"><div class="row"><strong>Episode '+esc(e.number??"")+'</strong><span class="muted">'+esc(e.title||"")+'</span></div><div class="small muted">'+esc(e.id)+'</div><button class="download" onclick="downloadEpisode('+JSON.stringify(e.id)+','+JSON.stringify(e.number??"")+','+JSON.stringify(e.title||"")+')">Download Best Quality</button><button class="inspect" onclick="inspect('+JSON.stringify(e.id)+','+JSON.stringify(e.title||"")+')">Inspect HLS</button><div class="job" id="job-'+esc(e.id)+'"></div></div>').join("")||'<div class="empty">No episodes returned.</div>'}
async function downloadEpisode(id,number,title){const box=document.getElementById("job-"+id);box.classList.add("show");box.innerHTML="Selecting best quality…";try{const d=await get("/api/download?series="+encodeURIComponent(currentSeries.id)+"&episode="+encodeURIComponent(id)+"&number="+encodeURIComponent(number)+"&title="+encodeURIComponent(title));jobs.set(d.job.id,box);monitor(d.job.id)}catch(e){box.innerHTML=esc(e.message)}}
async function monitor(id){const box=jobs.get(id);if(!box)return;try{const j=(await get("/api/download/"+id)).job;box.innerHTML='<strong>'+esc(j.quality||"best")+'</strong> · '+esc(j.resolution||"")+'<div class="bar"><div class="fill" style="width:'+Math.min(100,j.percent||0)+'%"></div></div><div class="muted">'+esc(j.state)+' · '+bytes(j.size||0)+(j.speed?" · "+esc(j.speed):"")+'</div>'+(j.filename?'<div class="small muted">'+esc(j.filename)+'</div>':"")+(j.error?'<div style="color:#ff6870">'+esc(j.error)+'</div>':"");if(j.state!=="completed"&&j.state!=="error")setTimeout(()=>monitor(id),1200)}catch(e){setTimeout(()=>monitor(id),2000)}}
async function inspect(id,title){document.getElementById("modalTitle").textContent=title;document.getElementById("modalSub").textContent="HLS inspection";document.getElementById("modalBody").innerHTML='<div class="loading">Inspecting…</div>';try{const d=await get("/api/stream-info?series="+encodeURIComponent(currentSeries.id)+"&episode="+encodeURIComponent(id)),s=d.stream;document.getElementById("modalBody").innerHTML='<button onclick="openSeries('+JSON.stringify(currentSeries.id)+','+JSON.stringify(currentSeries.title)+')">← Back to episodes</button><div class="variant best"><strong>Automatically selected: '+esc(s.best?(s.best.height+"p"):"Unavailable")+'</strong><div class="muted">'+esc(s.best?(s.best.width+"×"+s.best.height):"")+' · '+esc(s.best&&s.best.bandwidth?bytes(s.best.bandwidth)+"/s":"")+'</div></div>'+((s.variants||[]).map(v=>'<div class="variant"><div class="row"><strong>'+esc((v.height||"?")+"p")+'</strong><span>'+esc((v.width||"?")+"×"+(v.height||"?"))+'</span></div><div class="muted">'+esc(v.bandwidth?bytes(v.bandwidth)+"/s":"—")+' · avg '+esc(v.average_bandwidth?bytes(v.average_bandwidth)+"/s":"—")+' · '+esc(v.codecs||"—")+'</div><div class="small muted">'+esc(v.uri||"")+'</div></div>').join(""))}catch(e){document.getElementById("modalBody").innerHTML='<div class="empty">'+esc(e.message)+"</div>"}}
function closeModal(){document.getElementById("modal").classList.remove("open")}
async function health(){try{const d=await get("/api/health");toast("Server OK · FFmpeg "+(d.ffmpeg?"ready":"missing")+" · FFprobe "+(d.ffprobe?"ready":"missing"))}catch(e){toast(e.message)}}
loadSeries();
</script>
</body>
</html>
