plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.arywatcher.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.arywatcher.app"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "2.1.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    sourceSets { main { python.srcDirs = ["src/main/python"] } }

    signingConfigs {
        cinewave {
            def stableKeystore = file("cinewave-signing.keystore")
            def stablePassword = System.getenv("CINEWAVE_KEYSTORE_PASSWORD")
            if (stableKeystore.exists() && stablePassword) {
                storeFile stableKeystore
                storePassword stablePassword
                keyAlias "cinewave"
                keyPassword stablePassword
            }
        }
    }

    buildTypes {
        debug {
            def stableKeystore = file("cinewave-signing.keystore")
            if (stableKeystore.exists() && System.getenv("CINEWAVE_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.cinewave
            }
        }
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "/META-INF/DEPENDENCIES"]
        }
    }
}

chaquopy {
    defaultConfig { version = "3.11" }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7"
    // Explicitly package FFmpegKit smart-exception helper in the APK.
    implementation "com.arthenica:smart-exception-java:0.2.1"
}
