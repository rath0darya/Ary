plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.arywatcher.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.arywatcher.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    sourceSets { main { python.srcDirs = ["src/main/python"] } }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "/META-INF/DEPENDENCIES"]
        }
    }
}

chaquopy {
    defaultConfig { version = "3.11" }
}

dependencies {
    implementation "dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7"
}
