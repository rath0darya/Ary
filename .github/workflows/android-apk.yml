name: Build CineWave Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ary_episode_watcher.py"
      - "live_check.py"
      - "web/**"
      - "dar-e-nijaat-all-m3u8.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: cinewave-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Package current Python backend and website
        run: sh android/sync_sources.sh
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Upload APK as a temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinewave-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish APK to repository Download folder and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p Download
          cp android/app/build/outputs/apk/debug/app-debug.apk Download/CineWave.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish on top of the latest main to avoid non-fast-forward failures
          # when another commit lands while the APK is building.
          git fetch origin main
          git switch -C main origin/main
          git add Download/CineWave.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish CineWave APK from build ${GITHUB_RUN_NUMBER} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin main
          fi

          # Include the run ID and attempt so re-runs never collide with an existing tag.
          TAG="cinewave-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" Download/CineWave.apk \
            --title "CineWave ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes "Standalone Android APK built from source commit ${GITHUB_SHA}. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            --latest
