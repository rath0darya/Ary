name: Build native CineWave Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ary_episode_watcher.py"
      - "live_check.py"
      - "web/**"
      - "dar-e-nijaat-all-m3u8.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: cinewave-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Package Python API and catalogue data for native app
        run: sh android/sync_sources.sh
      - name: Configure stable app signing
        env:
          CINEWAVE_KEYSTORE_BASE64: ${{ secrets.CINEWAVE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CINEWAVE_KEYSTORE_BASE64"
          printf '%s' "$CINEWAVE_KEYSTORE_BASE64" | base64 --decode > android/app/cinewave-signing.keystore
      - name: Build debug APK
        env:
          CINEWAVE_KEYSTORE_PASSWORD: ${{ secrets.CINEWAVE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Upload APK as a temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinewave-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish the current APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          release_apk="android/app/build/outputs/apk/debug/CineWave.apk"
          release_tag="cinewave-android-latest"
          test -s "$apk_path"
          cp "$apk_path" "$release_apk"
          release_notes="$(cat <<EOF
          ## CineWave for Android

          CineWave Android 2.2.1. Native playback uses transparent gesture controls and stays inside the app. The embedded on-device Python service checks ARY+'s VOD API for episode records and direct HLS sources; episodes without an accessible direct stream are never redirected to an external episode page.

          [Download the current APK](https://github.com/${GH_REPO}/releases/latest/download/CineWave.apk) · [Project site](https://${GH_REPO%%/*}.github.io/${GH_REPO#*/}/)

          Built from commit ${SOURCE_SHA}. [Build details](${RUN_URL}).
          EOF
          )"

          if gh release view "$release_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$release_apk" --clobber --repo "$GH_REPO"
            gh release edit "$release_tag" --title "CineWave Android" --notes "$release_notes" --latest --repo "$GH_REPO"
          else
            gh release create "$release_tag" "$release_apk" \
              --title "CineWave Android" \
              --notes "$release_notes" \
              --target "$SOURCE_SHA" \
              --latest \
              --repo "$GH_REPO"
          fi

          while IFS= read -r old_asset; do
            [ -n "$old_asset" ] || continue
            gh release delete-asset "$release_tag" "$old_asset" --yes --repo "$GH_REPO"
          done < <(gh release view "$release_tag" --repo "$GH_REPO" --json assets --jq '.assets[].name | select(. != "CineWave.apk" and test("\\.apk$"; "i"))')

          # Keep old release notes, but remove obsolete APK binaries from earlier app builds.
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            while IFS= read -r old_asset; do
              [ -n "$old_asset" ] || continue
              gh release delete-asset "$old_tag" "$old_asset" --yes --repo "$GH_REPO"
            done < <(gh release view "$old_tag" --repo "$GH_REPO" --json assets --jq '.assets[].name | select(test("\\.apk$"; "i"))')
          done < <(gh release list --repo "$GH_REPO" --limit 100 --json tagName --jq ".[] | .tagName | select(startswith(\"cinewave-\") and . != \"$release_tag\")")
