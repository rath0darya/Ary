name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile ary_episode_watcher.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Browser JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/ary-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/ary-ui.js
